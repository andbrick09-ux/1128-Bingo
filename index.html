<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#051024">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sir's Protocol • The Vault</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Global Styles -->
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="nav.css">
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="icon-512.png">
</head>
<body data-nav="more">

  <!-- Persistent Topbar -->
  <div class="topbar">
    <div>
      <div class="topbar-title">The Vault</div>
      <div class="topbar-sub">Sir's Protocol</div>
    </div>
  </div>

  <!-- Main Content Area (dynamically loaded) -->
  <main id="app-content" class="main"></main>

  <!-- Bottom Navigation (loaded via nav.js) -->
  <div id="bottom-nav"></div>

  <script type="module">
    // Core imports
    import { requireAuth } from './auth.js';
    import { initNav, navigateTo } from './assets/js/core/nav.js';

    async function startApp() {
      const user = await requireAuth();
      if (!user) return;

      // Initialize bottom nav
      initNav();

      // Load default page (Toy Vault for now)
      await navigateTo('toy-vault');
    }

    // Global toast helper
    window.showToast = function(msg, type = 'success') {
      const toast = document.createElement('div');
      toast.style.cssText = `
        position:fixed; bottom:100px; left:50%; transform:translateX(-50%);
        background:\( {type==='error'?'#F44336':'var(--gold)'}; color: \){type==='error'?'white':'#051024'};
        padding:12px 24px; border-radius:9999px; font-size:13px; z-index:9999;
        box-shadow:0 8px 25px rgba(0,0,0,0.4); white-space:nowrap;
      `;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2800);
    };

    startApp().catch(console.error);
  </script>
</body>
</html>
