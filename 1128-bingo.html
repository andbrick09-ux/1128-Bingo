<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>1128 Bingo • SAP ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111520;
      --surface2: #181e2e;
      --border: rgba(255,255,255,0.07);
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.25);
      --accent2: #22d3ee;
      --danger: #ef4444;
      --text: #e8eaf0;
      --muted: #5a6480;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
      --display: 'Syne', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }

    /* ── Background grid ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 10;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10,12,16,0.85);
      backdrop-filter: blur(12px);
    }

    .logo-mark {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-mark::before {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--accent); }
      50% { opacity: 0.5; box-shadow: 0 0 2px var(--accent); }
    }

    .header-right {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Main ── */
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 16px;
      gap: 28px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Title section ── */
    .title-block {
      text-align: center;
    }

    .title-block h1 {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: #fff;
    }

    .title-block h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* ── Big Button ── */
    .button-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .bingo-btn {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: radial-gradient(circle at 35% 35%, #1e40af, #1e3a8a 60%, #0f1e5a);
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.3),
        0 0 30px rgba(59,130,246,0.15),
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.1);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .bingo-btn::before {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px solid rgba(59,130,246,0.2);
    }

    .bingo-btn::after {
      content: '';
      position: absolute;
      top: 12%;
      left: 20%;
      width: 35%;
      height: 20%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,255,255,0.12), transparent);
    }

    .bingo-btn:active {
      transform: scale(0.93);
      box-shadow:
        0 0 0 1px rgba(59,130,246,0.5),
        0 0 60px rgba(59,130,246,0.4),
        0 8px 20px rgba(0,0,0,0.5),
        inset 0 -2px 0 rgba(0,0,0,0.4);
    }

    .bingo-btn.flash {
      animation: btn-flash 0.35s ease-out;
    }

    @keyframes btn-flash {
      0% { box-shadow: 0 0 0 1px rgba(59,130,246,0.3), 0 0 30px rgba(59,130,246,0.15), 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }
      30% { box-shadow: 0 0 0 4px rgba(59,130,246,0.6), 0 0 80px rgba(59,130,246,0.5), 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15); }
      100% { box-shadow: 0 0 0 1px rgba(59,130,246,0.3), 0 0 30px rgba(59,130,246,0.15), 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); }
    }

    .btn-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: relative;
      z-index: 1;
    }

    .btn-label .heard {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .btn-label .number {
      font-family: var(--display);
      font-size: 36px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      text-shadow: 0 0 20px rgba(59,130,246,0.8);
      line-height: 1;
    }

    .btn-label .bingo-word {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent2);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s, transform 0.3s;
    }

    .bingo-btn.bingo .bingo-word {
      opacity: 1;
      transform: translateY(0);
    }

    .hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* ── Score ring ── */
    .score-ring-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .total-count {
      text-align: center;
    }

    .total-count .big-num {
      font-family: var(--display);
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      color: #fff;
      letter-spacing: -0.03em;
      transition: color 0.2s;
    }

    .total-count .big-num.bump {
      animation: num-bump 0.3s ease-out;
    }

    @keyframes num-bump {
      0% { transform: scale(1); }
      40% { transform: scale(1.2); color: var(--accent); }
      100% { transform: scale(1); }
    }

    .total-count .all-time-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0.4;
      border-radius: 2px 2px 0 0;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat-value {
      font-family: var(--display);
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .stat-badge {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--accent);
      text-transform: uppercase;
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 4px;
      padding: 2px 5px;
    }

    /* ── History ── */
    .history-section {
      width: 100%;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .clear-btn {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--danger);
      background: none;
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .clear-btn:hover { background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.4); }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .history-empty {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .history-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: row-in 0.25s ease-out;
    }

    @keyframes row-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .row-index {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      min-width: 24px;
    }

    .row-time {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      flex: 1;
      padding: 0 12px;
    }

    .row-date {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
    }

    .row-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      padding: 0 0 0 10px;
      line-height: 1;
      transition: color 0.15s;
    }
    .row-delete:hover { color: var(--danger); }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 100px;
      padding: 10px 20px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--accent2);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 10;
      padding: 12px 20px;
      text-align: center;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark">SAP · Live</div>
    <div class="header-right">ERP Meeting Edition</div>
  </header>

  <main>

    <div class="title-block">
      <h1><span>1128</span> Bingo</h1>
      <p class="subtitle">Press every time you hear it</p>
    </div>

    <div class="button-zone">
      <button class="bingo-btn" id="mainBtn" aria-label="Heard 1128">
        <div class="btn-label">
          <span class="heard">Heard</span>
          <span class="number">1128</span>
          <span class="bingo-word">Bingo!</span>
        </div>
      </button>
      <span class="hint">Tap · or press Space</span>
    </div>

    <div class="score-ring-wrap">
      <div class="total-count">
        <div class="big-num" id="allTimeCount">0</div>
        <div class="all-time-label">All time</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Today</span>
        <span class="stat-value" id="todayCount">0</span>
        <span class="stat-badge">Day</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">This Week</span>
        <span class="stat-value" id="weekCount">0</span>
        <span class="stat-badge">Week</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">This Month</span>
        <span class="stat-value" id="monthCount">0</span>
        <span class="stat-badge">Month</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">This Quarter</span>
        <span class="stat-value" id="quarterCount">0</span>
        <span class="stat-badge">Q</span>
      </div>
    </div>

    <div class="history-section">
      <div class="section-header">
        <span class="section-title">Entry History</span>
        <button class="clear-btn" id="clearBtn">Clear All</button>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty" id="emptyState">
          No entries yet — tap the button above
        </div>
      </div>
    </div>

  </main>

  <footer>Data stored locally · Nothing sent to any server</footer>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'bingo1128_entries';
    let entries = [];

    function load() {
      try {
        entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch { entries = []; }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function now() { return new Date(); }

    function startOf(unit) {
      const d = now();
      if (unit === 'day') { d.setHours(0,0,0,0); return d; }
      if (unit === 'week') { d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d; }
      if (unit === 'month') { d.setDate(1); d.setHours(0,0,0,0); return d; }
      if (unit === 'quarter') {
        const q = Math.floor(d.getMonth() / 3);
        d.setMonth(q * 3, 1); d.setHours(0,0,0,0); return d;
      }
    }

    function updateCounters() {
      const total = entries.length;
      const dayStart = startOf('day').getTime();
      const weekStart = startOf('week').getTime();
      const monthStart = startOf('month').getTime();
      const quarterStart = startOf('quarter').getTime();

      document.getElementById('allTimeCount').textContent = total;
      document.getElementById('todayCount').textContent = entries.filter(e => e.ts >= dayStart).length;
      document.getElementById('weekCount').textContent = entries.filter(e => e.ts >= weekStart).length;
      document.getElementById('monthCount').textContent = entries.filter(e => e.ts >= monthStart).length;
      document.getElementById('quarterCount').textContent = entries.filter(e => e.ts >= quarterStart).length;
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      const empty = document.getElementById('emptyState');

      if (entries.length === 0) {
        list.innerHTML = '';
        list.appendChild(empty);
        return;
      }

      const rows = [...entries].reverse().map((e, revIdx) => {
        const idx = entries.length - revIdx;
        const row = document.createElement('div');
        row.className = 'history-row';
        row.dataset.id = e.id;
        row.innerHTML = `
          <span class="row-index">#${idx}</span>
          <span class="row-time">${formatTime(e.ts)}</span>
          <span class="row-date">${formatDate(e.ts)}</span>
          <button class="row-delete" aria-label="Delete entry">×</button>
        `;
        row.querySelector('.row-delete').addEventListener('click', () => deleteEntry(e.id));
        return row;
      });

      list.innerHTML = '';
      rows.forEach(r => list.appendChild(r));
    }

    function addEntry() {
      const entry = { id: Date.now() + Math.random(), ts: Date.now() };
      entries.push(entry);
      save();
      updateCounters();
      renderHistory();

      // Bump animation
      const num = document.getElementById('allTimeCount');
      num.classList.remove('bump');
      void num.offsetWidth;
      num.classList.add('bump');

      // Flash button
      const btn = document.getElementById('mainBtn');
      btn.classList.remove('flash');
      void btn.offsetWidth;
      btn.classList.add('flash');

      // BINGO at multiples of 5
      if (entries.length % 5 === 0) {
        btn.classList.add('bingo');
        showToast(`🎉 ${entries.length} hits — you owe yourself a coffee`);
        setTimeout(() => btn.classList.remove('bingo'), 2000);
      }
    }

    function deleteEntry(id) {
      entries = entries.filter(e => e.id !== id);
      save();
      updateCounters();
      renderHistory();
    }

    function clearAll() {
      if (!confirm('Clear all 1128 entries?')) return;
      entries = [];
      save();
      updateCounters();
      renderHistory();
      showToast('All entries cleared');
    }

    let toastTimer;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // Init
    load();
    updateCounters();
    renderHistory();

    document.getElementById('mainBtn').addEventListener('click', addEntry);
    document.getElementById('clearBtn').addEventListener('click', clearAll);

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        addEntry();
      }
    });
  </script>
</body>
</html>
